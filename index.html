<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prompt Vault — Quản lý Prompt</title>
<style>
  :root{
    --bg:#0a0e1a;
    --bg-2:#111827;
    --card:#161c2c;
    --card-2:#1f2740;
    --border:#2a3350;
    --text:#e6ebf5;
    --muted:#8892b0;
    --accent:#ff6b35;
    --accent-2:#ffb347;
    --cyan:#00d4ff;
    --danger:#ff4757;
    --success:#2ed573;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter','Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px circle at 10% 10%, rgba(255,107,53,.08), transparent 50%),
      radial-gradient(500px circle at 90% 80%, rgba(0,212,255,.06), transparent 50%);
  }
  .app{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:100vh;position:relative;z-index:1}

  /* SIDEBAR */
  .sidebar{
    background:linear-gradient(180deg,var(--bg-2),var(--bg));
    border-right:1px solid var(--border);
    padding:20px 16px;
    display:flex;flex-direction:column;gap:16px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-size:20px;font-weight:800;letter-spacing:.5px;
    padding:8px 4px;
  }
  .logo .icon{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#0a0e1a;font-weight:900;
    box-shadow:0 6px 20px rgba(255,107,53,.35);
  }
  .logo span b{color:var(--accent)}
  .section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);padding:8px 6px 4px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .section-title button{
    background:transparent;border:0;color:var(--accent);
    cursor:pointer;font-size:16px;font-weight:700;line-height:1;
  }
  .section-title button:hover{color:var(--accent-2)}
  .folder-list{display:flex;flex-direction:column;gap:4px}
  .folder-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    color:var(--muted);font-weight:500;font-size:14px;
    transition:all .15s;position:relative;
  }
  .folder-item:hover{background:var(--card);color:var(--text)}
  .folder-item.active{
    background:linear-gradient(90deg,rgba(255,107,53,.18),transparent);
    color:var(--text);border-left:3px solid var(--accent);padding-left:9px;
  }
  .folder-item .count{
    margin-left:auto;background:var(--card-2);
    padding:2px 8px;border-radius:10px;font-size:11px;color:var(--muted);
  }
  .folder-item.active .count{background:rgba(255,107,53,.25);color:var(--accent-2)}
  .folder-item .del{
    display:none;margin-left:4px;color:var(--danger);font-weight:700;
  }
  .folder-item:hover .del{display:inline}
  .folder-item:hover .count{display:none}

  .io-buttons{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
  .btn{
    padding:10px 14px;border-radius:8px;border:0;cursor:pointer;
    font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;
    justify-content:center;transition:all .15s;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0e1a}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,107,53,.3)}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn-danger:hover{background:var(--danger);color:#fff}

  /* MAIN */
  .main{padding:24px 32px;overflow-y:auto}
  .topbar{
    display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap;
  }
  .search{
    flex:1;min-width:220px;position:relative;
  }
  .search input{
    width:100%;padding:12px 14px 12px 40px;
    background:var(--card);border:1px solid var(--border);
    color:var(--text);border-radius:10px;font-size:14px;outline:none;
    transition:border-color .15s;
  }
  .search input:focus{border-color:var(--accent)}
  .search::before{
    content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.7;
  }
  .tag-filter{
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  }
  .tag-chip{
    padding:6px 12px;background:var(--card);border:1px solid var(--border);
    border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;
    transition:all .15s;
  }
  .tag-chip:hover{color:var(--text);border-color:var(--accent)}
  .tag-chip.active{
    background:var(--accent);color:#0a0e1a;border-color:var(--accent);font-weight:600;
  }

  .prompt-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;
  }
  .prompt-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px;display:flex;flex-direction:column;gap:10px;
    transition:all .2s;position:relative;overflow:hidden;
  }
  .prompt-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--cyan));
    transform:scaleX(0);transform-origin:left;transition:transform .3s;
  }
  .prompt-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .prompt-card:hover::before{transform:scaleX(1)}
  .prompt-title{
    font-size:16px;font-weight:700;color:var(--text);
    display:flex;align-items:center;gap:8px;
  }
  .prompt-title .folder-badge{
    font-size:10px;background:var(--card-2);color:var(--cyan);
    padding:2px 8px;border-radius:10px;font-weight:500;
  }
  .prompt-content{
    font-size:13px;color:var(--muted);line-height:1.6;
    max-height:120px;overflow:hidden;position:relative;
    background:var(--bg-2);padding:10px 12px;border-radius:8px;
    border-left:2px solid var(--accent);
    white-space:pre-wrap;word-break:break-word;
  }
  .prompt-content a{color:var(--cyan);text-decoration:underline}
  .prompt-content a:hover{color:var(--accent-2)}
  .prompt-tags{display:flex;gap:6px;flex-wrap:wrap}
  .prompt-tag{
    font-size:11px;padding:3px 8px;border-radius:6px;
    background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.25);
  }
  .prompt-actions{display:flex;gap:6px;margin-top:4px}
  .icon-btn{
    flex:1;padding:7px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;font-size:12px;
    transition:all .15s;font-weight:500;
  }
  .icon-btn:hover{background:var(--card-2);color:var(--text);border-color:var(--accent)}
  .icon-btn.copy:hover{color:var(--success);border-color:var(--success)}
  .icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
  }
  .empty .big{font-size:48px;margin-bottom:12px;opacity:.3}

  /* MODAL */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-backdrop.show{display:flex}
  .modal{
    background:var(--bg-2);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:560px;padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    max-height:90vh;overflow-y:auto;
  }
  .modal h2{
    margin-bottom:18px;color:var(--text);font-size:20px;
    display:flex;align-items:center;gap:10px;
  }
  .modal h2::before{
    content:"";width:4px;height:22px;background:var(--accent);border-radius:2px;
  }
  .form-group{margin-bottom:14px}
  .form-group label{
    display:block;margin-bottom:6px;font-size:12px;
    color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;
  }
  .form-group input, .form-group textarea, .form-group select{
    width:100%;padding:10px 12px;background:var(--card);
    border:1px solid var(--border);border-radius:8px;color:var(--text);
    font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus{border-color:var(--accent)}
  .form-group textarea{min-height:140px;resize:vertical;line-height:1.6}
  .form-group .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;right:24px;
    background:var(--card);border:1px solid var(--success);
    color:var(--success);padding:12px 18px;border-radius:10px;
    font-weight:600;font-size:13px;z-index:200;
    transform:translateY(100px);opacity:0;transition:all .3s;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{transform:translateY(0);opacity:1}
  .toast.error{border-color:var(--danger);color:var(--danger)}

  /* Scrollbar */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  @media (max-width:768px){
    .app{grid-template-columns:1fr}
    .sidebar{position:relative;height:auto}
    .main{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="icon">⚡</div>
      <span>Prompt<b>Vault</b></span>
    </div>

    <div>
      <div class="section-title">
        <span>Thư mục</span>
        <button onclick="openFolderModal()" title="Thêm thư mục">+</button>
      </div>
      <div class="folder-list" id="folderList"></div>
    </div>

    <div class="io-buttons">
      <button class="btn btn-primary" onclick="openPromptModal()">＋ Prompt mới</button>
      <button class="btn btn-ghost" onclick="exportData()">⬇ Xuất JSON</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆ Nhập JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"/>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="search">
        <input type="text" id="searchInput" placeholder="Tìm theo tên, nội dung, tag..." oninput="render()"/>
      </div>
    </div>
    <div class="tag-filter" id="tagFilter"></div>
    <div style="height:16px"></div>
    <div class="prompt-grid" id="promptGrid"></div>
  </main>
</div>

<!-- MODAL PROMPT -->
<div class="modal-backdrop" id="promptModal">
  <div class="modal">
    <h2 id="promptModalTitle">Thêm Prompt</h2>
    <div class="form-group">
      <label>Tên Prompt</label>
      <input type="text" id="pName" placeholder="VD: Tóm tắt bài viết"/>
    </div>
    <div class="form-group">
      <label>Thư mục</label>
      <select id="pFolder"></select>
    </div>
    <div class="form-group">
      <label>Nội dung</label>
      <textarea id="pContent" placeholder="Nhập nội dung prompt. Link sẽ tự động nhận diện (https://...)"></textarea>
      <div class="hint">Đường link http/https sẽ được chuyển thành liên kết có thể click.</div>
    </div>
    <div class="form-group">
      <label>Tags</label>
      <input type="text" id="pTags" placeholder="coding, writing, gpt4 (cách nhau bởi dấu phẩy)"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('promptModal')">Hủy</button>
      <button class="btn btn-primary" onclick="savePrompt()">Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL FOLDER -->
<div class="modal-backdrop" id="folderModal">
  <div class="modal">
    <h2>Thêm Thư mục</h2>
    <div class="form-group">
      <label>Tên thư mục</label>
      <input type="text" id="fName" placeholder="VD: Marketing, Code, Viết lách..."/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('folderModal')">Hủy</button>
      <button class="btn btn-primary" onclick="saveFolder()">Tạo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const STORAGE_KEY = 'promptVault_v1';
let state = {
  folders: [],
  prompts: [],
  activeFolder: 'all',
  activeTag: null,
  editingId: null
};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.folders = d.folders || [];
      state.prompts = d.prompts || [];
    }
    if(state.folders.length===0){
      state.folders = [
        {id:uid(), name:'Tổng hợp'},
        {id:uid(), name:'Code'},
        {id:uid(), name:'Viết lách'}
      ];
      save();
    }
  }catch(e){console.error(e)}
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    folders:state.folders, prompts:state.prompts
  }));
}

/* ============ RENDER ============ */
function render(){
  renderFolders();
  renderTags();
  renderPrompts();
}

function renderFolders(){
  const list = document.getElementById('folderList');
  const allCount = state.prompts.length;
  let html = `<div class="folder-item ${state.activeFolder==='all'?'active':''}" onclick="selectFolder('all')">
    <span>📚</span><span>Tất cả</span><span class="count">${allCount}</span>
  </div>`;
  state.folders.forEach(f=>{
    const c = state.prompts.filter(p=>p.folderId===f.id).length;
    html += `<div class="folder-item ${state.activeFolder===f.id?'active':''}" onclick="selectFolder('${f.id}')">
      <span>📁</span><span>${escapeHtml(f.name)}</span>
      <span class="count">${c}</span>
      <span class="del" onclick="event.stopPropagation();deleteFolder('${f.id}')" title="Xóa">✕</span>
    </div>`;
  });
  list.innerHTML = html;
}

function renderTags(){
  const allTags = new Set();
  state.prompts.forEach(p=>(p.tags||[]).forEach(t=>allTags.add(t)));
  const container = document.getElementById('tagFilter');
  if(allTags.size===0){container.innerHTML='';return}
  let html = `<span class="tag-chip ${state.activeTag===null?'active':''}" onclick="filterTag(null)">Tất cả</span>`;
  [...allTags].sort().forEach(t=>{
    html += `<span class="tag-chip ${state.activeTag===t?'active':''}" onclick="filterTag('${escapeAttr(t)}')">#${escapeHtml(t)}</span>`;
  });
  container.innerHTML = html;
}

function renderPrompts(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = state.prompts.slice();
  if(state.activeFolder!=='all') list = list.filter(p=>p.folderId===state.activeFolder);
  if(state.activeTag) list = list.filter(p=>(p.tags||[]).includes(state.activeTag));
  if(q) list = list.filter(p=>
    p.name.toLowerCase().includes(q) ||
    p.content.toLowerCase().includes(q) ||
    (p.tags||[]).some(t=>t.toLowerCase().includes(q))
  );
  list.sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));

  const grid = document.getElementById('promptGrid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="big">📭</div>
      <div>Chưa có prompt nào${q?' phù hợp':''}.</div>
      <div style="font-size:13px;margin-top:6px">Bấm "＋ Prompt mới" để bắt đầu.</div>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(p=>{
    const folder = state.folders.find(f=>f.id===p.folderId);
    const contentHtml = linkify(escapeHtml(p.content));
    return `<div class="prompt-card">
      <div class="prompt-title">
        ${escapeHtml(p.name)}
        ${folder?`<span class="folder-badge">${escapeHtml(folder.name)}</span>`:''}
      </div>
      <div class="prompt-content">${contentHtml}</div>
      <div class="prompt-tags">
        ${(p.tags||[]).map(t=>`<span class="prompt-tag">#${escapeHtml(t)}</span>`).join('')}
      </div>
      <div class="prompt-actions">
        <button class="icon-btn copy" onclick="copyPrompt('${p.id}')">📋 Copy</button>
        <button class="icon-btn" onclick="editPrompt('${p.id}')">✏️ Sửa</button>
        <button class="icon-btn del" onclick="deletePrompt('${p.id}')">🗑 Xóa</button>
      </div>
    </div>`;
  }).join('');
}

/* ============ UTILS ============ */
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,"\\'")}
function linkify(text){
  // text đã được escapeHtml, giờ tìm URL trong đó
  return text.replace(/(https?:\/\/[^\s<]+)/g, (m)=>{
    // m có thể chứa &amp; do escape
    const clean = m.replace(/&amp;/g,'&');
    return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>`;
  });
}
function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type==='error'?' error':'');
  setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ ACTIONS ============ */
function selectFolder(id){state.activeFolder=id;state.activeTag=null;render()}
function filterTag(t){state.activeTag=t;render()}

function openFolderModal(){
  document.getElementById('fName').value='';
  openModal('folderModal');
  setTimeout(()=>document.getElementById('fName').focus(),50);
}
function saveFolder(){
  const name = document.getElementById('fName').value.trim();
  if(!name){toast('Nhập tên thư mục','error');return}
  state.folders.push({id:uid(), name});
  save();render();closeModal('folderModal');
  toast('Đã tạo thư mục');
}
function deleteFolder(id){
  const count = state.prompts.filter(p=>p.folderId===id).length;
  if(!confirm(`Xóa thư mục này?${count?` (${count} prompt sẽ chuyển về "không thư mục")`:''}`))return;
  state.folders = state.folders.filter(f=>f.id!==id);
  // prompt trong thư mục bị xóa -> folderId = ''
  state.prompts.forEach(p=>{if(p.folderId===id)p.folderId=''});
  if(state.activeFolder===id)state.activeFolder='all';
  save();render();
}

function openPromptModal(){
  state.editingId = null;
  document.getElementById('promptModalTitle').textContent = 'Thêm Prompt';
  document.getElementById('pName').value='';
  document.getElementById('pContent').value='';
  document.getElementById('pTags').value='';
  const sel = document.getElementById('pFolder');
  sel.innerHTML = `<option value="">-- Không chọn --</option>` +
    state.folders.map(f=>`<option value="${f.id}" ${f.id===state.activeFolder&&state.activeFolder!=='all'?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
  openModal('promptModal');
  setTimeout(()=>document.getElementById('pName').focus(),50);
}
function editPrompt(id){
  const p = state.prompts.find(x=>x.id===id);if(!p)return;
  state.editingId = id;
  document.getElementById('promptModalTitle').textContent = 'Sửa Prompt';
  document.getElementById('pName').value = p.name;
  document.getElementById('pContent').value = p.content;
  document.getElementById('pTags').value = (p.tags||[]).join(', ');
  const sel = document.getElementById('pFolder');
  sel.innerHTML = `<option value="">-- Không chọn --</option>` +
    state.folders.map(f=>`<option value="${f.id}" ${f.id===p.folderId?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
  openModal('promptModal');
}
function savePrompt(){
  const name = document.getElementById('pName').value.trim();
  const content = document.getElementById('pContent').value;
  const folderId = document.getElementById('pFolder').value;
  const tags = document.getElementById('pTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(!name){toast('Nhập tên prompt','error');return}
  if(!content.trim()){toast('Nhập nội dung prompt','error');return}
  if(state.editingId){
    const p = state.prompts.find(x=>x.id===state.editingId);
    Object.assign(p,{name,content,folderId,tags,updatedAt:Date.now()});
    toast('Đã cập nhật');
  }else{
    state.prompts.push({id:uid(),name,content,folderId,tags,createdAt:Date.now(),updatedAt:Date.now()});
    toast('Đã thêm prompt');
  }
  save();render();closeModal('promptModal');
}
function deletePrompt(id){
  if(!confirm('Xóa prompt này?'))return;
  state.prompts = state.prompts.filter(p=>p.id!==id);
  save();render();toast('Đã xóa');
}
function copyPrompt(id){
  const p = state.prompts.find(x=>x.id===id);if(!p)return;
  navigator.clipboard.writeText(p.content).then(()=>toast('Đã copy nội dung'));
}

/* ============ MODAL ============ */
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.modal-backdrop').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.modal-backdrop.show').forEach(m=>m.classList.remove('show'));
});

/* ============ IMPORT / EXPORT ============ */
function exportData(){
  const data = {
    version:1,
    exportedAt:new Date().toISOString(),
    folders:state.folders,
    prompts:state.prompts
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `prompt-vault-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Đã xuất file JSON');
}
function importData(e){
  const file = e.target.files[0];if(!file)return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const d = JSON.parse(ev.target.result);
      if(!d.folders||!d.prompts)throw new Error('Format không hợp lệ');
      if(!confirm(`Nhập ${d.folders.length} thư mục và ${d.prompts.length} prompt?\n(Dữ liệu hiện tại sẽ bị ghi đè)`))return;
      state.folders = d.folders;
      state.prompts = d.prompts;
      state.activeFolder='all';state.activeTag=null;
      save();render();
      toast('Đã nhập dữ liệu thành công');
    }catch(err){toast('Lỗi: '+err.message,'error')}
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ============ INIT ============ */
load();
render();
</script>
